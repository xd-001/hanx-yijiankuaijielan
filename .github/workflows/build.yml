name: Android Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: 

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 💥 终极锁死签名：如果没有签名文件，就当场生成一个，并永久保存到你的代码仓库里！
    - name: Generate and Save Keystore Permanently
      run: |
        if [ ! -f "app/keystore.jks" ]; then
          echo "Keystore not found, generating a new one..."
          keytool -genkey -v -keystore app/keystore.jks -storepass 123456 -alias mykey -keypass 123456 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Quick, OU=App, O=App, L=City, ST=State, C=US"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add app/keystore.jks
          git commit -m "Auto-generate permanent keystore"
          git push
        else
          echo "Keystore already exists! Reusing the permanent signature."
        fi

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.4'

    - name: Build Release APK
      run: gradle assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: 快捷通知-完美最终版
        path: app/build/outputs/apk/release/app-release.apk

    - name: Publish APK to Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.6.6
        name: 快捷通知.1.6.6
        body: |
          快捷通知.1.4
          - 新增「关于」：版本信息、隐私说明、完整更新记录
          - 新增「使用说明」：自启动、电池白名单、锁定任务、通知权限，可一键跳转
          - 新增使用记录导出 / 导入：7 天 / 30 天 / 全部，走系统文件选择器（零权限零 root）
          - 新增 4 档背景：白天 / 护眼（暖纸）/ 夜间温和 / 夜间激进
          - 新增 6 种主题色：紫 / 苹果蓝 / 苹果粉 / 苹果绿 / 苹果橙 / 苹果紫
          - 背景与主题色相互独立，可自由组合（4 × 6 = 24 种）
          - 全界面颜色统一收到 AppTheme 令牌，深色下强调色自动提亮
          - 状态栏 / 导航栏跟随底色，深色下图标自动刷亮
          - 悬浮底栏改为跟随卡片的半透色，深色下不再是白板
        files: app/build/outputs/apk/release/app-release.apk
        make_latest: true
