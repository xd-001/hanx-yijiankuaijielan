name: Android Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: 

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 💥 终极锁死签名：如果没有签名文件，就当场生成一个，并永久保存到你的代码仓库里！
    - name: Generate and Save Keystore Permanently
      run: |
        if [ ! -f "app/keystore.jks" ]; then
          echo "Keystore not found, generating a new one..."
          keytool -genkey -v -keystore app/keystore.jks -storepass 123456 -alias mykey -keypass 123456 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Quick, OU=App, O=App, L=City, ST=State, C=US"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add app/keystore.jks
          git commit -m "Auto-generate permanent keystore"
          git push
        else
          echo "Keystore already exists! Reusing the permanent signature."
        fi

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.4'

    - name: Build Release APK
      run: gradle assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: 快捷通知-完美最终版
        path: app/build/outputs/apk/release/app-release.apk

    - name: Publish APK to Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.1.0
        name: 快捷通知.1.1
        body: |
          快捷通知.1.1
          - 主界面极简改版：状态胶囊 + 圆形通知预览 + 开启/刷新 + 停止
          - 点按圆形预览进入设置；编辑应用与排序收进二级页
          - 应用图标保持圆角矩形显示
          - 新增累计打开次数：队列和打开记录里显示次数
          - 记录上限只裁剪明细，不清空累计次数
          - 保留 1.10 的开机自启修复和“打开 XX”Toast 移除
        files: app/build/outputs/apk/release/app-release.apk
        make_latest: true
