name: Android Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: 

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 💥 终极锁死签名：如果没有签名文件，就当场生成一个，并永久保存到你的代码仓库里！
    - name: Generate and Save Keystore Permanently
      run: |
        if [ ! -f "app/keystore.jks" ]; then
          echo "Keystore not found, generating a new one..."
          keytool -genkey -v -keystore app/keystore.jks -storepass 123456 -alias mykey -keypass 123456 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Quick, OU=App, O=App, L=City, ST=State, C=US"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add app/keystore.jks
          git commit -m "Auto-generate permanent keystore"
          git push
        else
          echo "Keystore already exists! Reusing the permanent signature."
        fi

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.4'

    - name: Build Release APK
      run: gradle assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: 快捷通知-完美最终版
        path: app/build/outputs/apk/release/app-release.apk
